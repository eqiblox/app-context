name: publish
on:
  push:
    branches: 
      - master
  workflow_dispatch:
    
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
        
      - name: Install/Restore Nuget
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore -c Release
      
      - name: Do Tests
        run: dotnet test --no-build --no-restore -c Release
        
      - name: Pack for NuGet
        run: dotnet pack --no-build --no-restore --output ./dist -c Release
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: package-build
          path: |
            ./dist/*.nupkg
  
  deploy:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs:
      - build
    
    steps:
      - name: Setup DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      
      - name: Restore Artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-build
          path: dist
        
      - name: Publish to Registry
        run: dotnet nuget push "dist/*.nupkg" --source ${{ vars.REGISTRY_URL }} --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Do Cleanup
        run: rm -rf dist